<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Login — Kiziee GBP Review Manager</title>
<link rel="icon" type="image/png" href="/static/kiziee_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Alata&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #3A2CCB;
  --primary-light: #5B4FD9;
  --primary-glow: rgba(58, 44, 203, 0.22);
  --bg: #F5F5F7;
  --surface: #FFFFFF;
  --border: #E5E7EB;
  --text: #0F0F10;
  --text2: #4B5563;
  --text3: #9CA3AF;
  --red: #DC2626;
  --radius: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--bg);
  background-image: 
    radial-gradient(circle at 10% 10%, rgba(91, 79, 217, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 90% 90%, rgba(58, 44, 203, 0.06) 0%, transparent 40%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.login-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 38px 32px 34px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 16px 48px rgba(15, 15, 16, 0.06);
  position: relative;
}

.brand-header {
  text-align: center;
  margin-bottom: 26px;
}

.brand-logo-wrap {
  width: 54px;
  height: 54px;
  border-radius: 14px;
  background: #FFFFFF;
  border: 1.5px solid var(--border);
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  padding: 5px;
}

.brand-logo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.brand-title {
  font-family: 'Alata', sans-serif;
  font-size: 22px;
  color: var(--text);
  margin-bottom: 4px;
}

.brand-sub {
  font-size: 12.5px;
  color: var(--text2);
  line-height: 1.45;
}

.error-banner {
  background: #FEF2F2;
  border: 1px solid #FCA5A5;
  color: var(--red);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 12.5px;
  margin-bottom: 18px;
  display: none;
  align-items: center;
  gap: 8px;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text2);
  margin-bottom: 6px;
}

.input-wrap {
  position: relative;
}

.input-wrap input {
  width: 100%;
  padding: 12px 14px;
  background: #FAFAFC;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: all 0.2s ease;
}

.input-wrap input:focus {
  background: #FFFFFF;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
}

.btn-login {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #FFFFFF;
  border: none;
  border-radius: 12px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 18px var(--primary-glow);
  margin-top: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-login:hover {
  transform: translateY(-2px);
  filter: brightness(1.06);
  box-shadow: 0 8px 24px var(--primary-glow);
}

.btn-login:disabled {
  opacity: 0.65;
  cursor: not-allowed;
  transform: none;
}

.divider {
  display: flex;
  align-items: center;
  text-align: center;
  color: var(--text3);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  margin: 22px 0 16px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  border-bottom: 1px solid var(--border);
}
.divider::before { margin-right: 12px; }
.divider::after { margin-left: 12px; }

.footer-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  text-align: center;
}

.link-btn {
  display: inline-block;
  width: 100%;
  padding: 11px;
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--text2);
  border-radius: 12px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  transition: all 0.15s ease;
  cursor: pointer;
}

.link-btn:hover {
  background: #F3F4F6;
  border-color: #D1D5DB;
  color: var(--text);
}

.admin-sublink {
  font-size: 11.5px;
  color: var(--text3);
  text-decoration: none;
  margin-top: 6px;
  transition: color 0.15s;
}

.admin-sublink:hover {
  color: var(--primary);
  text-decoration: underline;
}

.powered-tag {
  margin-top: 20px;
  font-size: 11.5px;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 5px;
}
.powered-tag img {
  width: 15px;
  height: 15px;
  object-fit: contain;
}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-header">
    <div class="brand-logo-wrap">
      <img src="/static/kiziee_logo.png" alt="Kiziee Media">
    </div>
    <h1 class="brand-title">Business Portal</h1>
    <p class="brand-sub">Access your Google Business Profile & review dashboard</p>
  </div>

  <div class="error-banner" id="errBox">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="errText">{{ error or '' }}</span>
  </div>

  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="form-group">
      <label>Business Slug</label>
      <div class="input-wrap">
        <input type="text" id="slug" placeholder="e.g. gir-natural" required autocomplete="username" autofocus>
      </div>
    </div>

    <div class="form-group">
      <label>Secret Passcode</label>
      <div class="input-wrap">
        <input type="password" id="passcode" placeholder="Enter your business passcode" required autocomplete="current-password">
      </div>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">
      <span>Sign In to Dashboard</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </form>

  <div class="divider">NEW TO THE PLATFORM?</div>

  <div class="footer-actions">
    <a href="/register" class="link-btn">Register New Business →</a>
    <a href="/admin/login" class="admin-sublink">Looking for Super Admin? Login here</a>
  </div>
</div>

<div class="powered-tag">
  <img src="/static/kiziee_logo.png" alt="Kiziee Media">
  <span>Powered by <strong>Kiziee Media</strong></span>
</div>

<script>
async function doLogin(e) {
  if (e) e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errBox = document.getElementById('errBox');
  const errText = document.getElementById('errText');

  btn.disabled = true;
  btn.innerHTML = '<span>Verifying credentials...</span>';
  errBox.style.display = 'none';

  const slug = document.getElementById('slug').value.trim();
  const passcode = document.getElementById('passcode').value.trim();

  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, passcode })
    });
    const data = await res.json();
    if (data.ok) {
      location.href = '/dashboard';
    } else {
      errText.textContent = data.error || 'Invalid business slug or passcode';
      errBox.style.display = 'flex';
      btn.disabled = false;
      btn.innerHTML = '<span>Sign In to Dashboard</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
    }
  } catch(err) {
    errText.textContent = 'Server connection error. Please try again.';
    errBox.style.display = 'flex';
    btn.disabled = false;
    btn.innerHTML = '<span>Sign In to Dashboard</span>';
  }
}
</script>
</body>
</html>
